        .btn {

            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        function generateQuiz(count) {
            if (!selectedWords.length) return;
            const pool = [...selectedWords].sort(() => 0.5 - Math.random()).slice(0, count);
            quizQuestions = pool.map(w => {
                const correct = w.japanese;
                const distractors = vocabularyData
                    .filter(x => x.japanese !== correct)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(x => x.japanese);
                return {
                    q: w.english,
                    correct,
                    opts: [correct, ...distractors].sort(() => 0.5 - Math.random())
                };
            });
            score = 0;
            currentQuestionIndex = 0;
            incorrectAnswers = [];
            showQuizQuestion();
            switchSection('quiz');
        }

        function showQuizQuestion() {
            const q = quizQuestions[currentQuestionIndex];
            if(!q) return;
            document.getElementById('quiz-question').textContent = q.q;
            document.getElementById('quiz-progress').textContent = `${currentQuestionIndex + 1}/${quizQuestions.length}`;
            const optsEl = document.getElementById('quiz-options');
            optsEl.innerHTML = '';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('next-question-btn').classList.add('hidden');

            q.opts.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'quiz-option text-base sm:text-lg font-medium';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(btn, opt, q);
                optsEl.appendChild(btn);
            });
        }

        function handleAnswer(btn, ans, q) {
            if (document.querySelector('.quiz-option.correct')) return;
            const isCorrect = ans === q.correct;
            if (isCorrect) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = '<span class="text-green-600"><i class="fas fa-check-circle mr-2"></i> 正解!</span>';
                score++;
            } else {
                btn.classList.add('incorrect');
                [...document.querySelectorAll('.quiz-option')].forEach(el => {
                    if (el.textContent === q.correct) el.classList.add('correct');
                });
                document.getElementById('feedback').innerHTML = `<span class="text-red-500"><i class="fas fa-times-circle mr-2"></i> 正解: ${escapeHtml(q.correct)}</span>`;
                incorrectAnswers.push({q: q.q, a: q.correct});
            }
            document.getElementById('next-question-btn').classList.remove('hidden');
        }

        function initSpeech() {
            if ('speechSynthesis' in window) {
                const loadVoices = () => {
                    voices = window.speechSynthesis.getVoices();
                };
                window.speechSynthesis.onvoiceschanged = loadVoices;
                loadVoices();
            }
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // 進行中の音声を停止
            
            // [...] を除去し、不要な記号をプレーンなテキストにする
            const clean = text.replace(/[\[\]]/g, '').split('/')[0].trim();
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'en-US';
            u.rate = 0.82; // 少しゆっくりめで聞き取りやすく
            
            // 英語(アメリカ)の高品質な音声を探す
            const preferredVoice = voices.find(v => v.name.includes('Google US English') && v.lang === 'en-US') || 
                                   voices.find(v => v.name.includes('Samantha') && v.lang === 'en-US') || 
                                   voices.find(v => v.lang.startsWith('en-'));
            if (preferredVoice) u.voice = preferredVoice;
            window.speechSynthesis.speak(u);
        }

        const getLevenshteinDist = (s, t) => {
            const m = s.length, n = t.length;
            const d = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let j = 1; j <= n; j++) {
                for (let i = 1; i <= m; i++) {
                    const cost = s[i - 1] === t[j - 1] ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                }
            }
            return d[m][n];
        };

                if (!window.SpeechRecognition) return alert('ご利用のブラウザは音声認識に対応していません。Google Chrome等をお使いください。');
                
                if (recognition && recognition.started) { 
                    recognition.stop(); 
                    return; 
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        recordedAudioURL = URL.createObjectURL(blob);
                        els.recordingPlayer.src = recordedAudioURL;
                        document.getElementById('play-recording-btn').disabled = false;
                        document.getElementById('play-recording-btn').classList.remove('btn-disabled');
                        els.micIcon.classList.remove('recording');
                        els.micIcon.className = 'fas fa-microphone text-2xl';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();

                    recognition = new SpeechRecognition();
                    recognition.lang = 'en-US';
                    recognition.started = true;
                    els.micIcon.className = 'fas fa-stop text-2xl';
                    els.micIcon.classList.add('recording');
                    els.pronunciationFeedback.innerHTML = '<span class="text-brand-500 animate-pulse font-bold text-lg"><i class="fas fa-wave-square mr-2"></i>聞き取り中... 発音してください</span>';

                    recognition.onresult = (ev) => {
                        const transcript = ev.results[0][0].transcript.toLowerCase().trim();
                        // ターゲットワードの括弧を取り除く
                        const target = els.englishText.textContent.toLowerCase().replace(/[\[\]]/g, '').trim();
                        
                        const d = getLevenshteinDist(transcript, target);
                        const maxLen = Math.max(transcript.length, target.length);
                        const score = Math.max(0, Math.round((1 - d / (maxLen || 1)) * 100));
                        
                        let msg = '', color = '';
                        // 3段階採点機能（甘めの判定）
                        if (score > 65) { 
                            msg = 'Excellent!'; 
                            color = 'text-green-600 bg-green-50 border-green-200'; 
                        } else if (score > 35) { 
                            msg = 'Good job!'; 
                            color = 'text-blue-500 bg-blue-50 border-blue-200';

                                <span class="text-xl font-bold">${msg} (${score}%)</span>

                    };
                    recognition.onend = () => {
                        recognition.started = false;
                        if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                    };
                    recognition.start();
                } catch (err) { 
                    alert('マイクの使用許可が必要です。'); 
                }
            };

                            ${valid.map((w, i) => {
                                // [...] 部分を空所に置換
                                const blankSentence = w.sentence.replace(/\[(.*?)\]/g, '____________________');
                                return `
                                    <div style="border-bottom: 1px dashed #cbd5e1; padding-bottom: 15px;">
                                        <div style="display: flex; align-items: flex-start; margin-bottom: 8px;">
                                            <span style="font-weight:bold; color:#475569; margin-right:15px;">(${i+1})</span>
                                            <span style="font-size:16px; font-family:serif; line-height:1.5; color:#0f172a;">${escapeHtml(blankSentence)}</span>
                                        </div>
                                        <div style="color:#475569; font-size:13.5px; margin-left:35px; padding-left:10px; border-left:3px solid #cbd5e1;">
                                            訳: ${escapeHtml(w.sentence_ja)}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div style="page-break-before:always;"></div>
                        <h1 style="text-align:center; border-bottom:2px solid #333; padding-bottom:10px; margin-bottom:30px;">例文穴埋め実戦テスト 【解答】</h1>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 15px; font-size:15px;">
                            ${valid.map((w, i) => {
                                // [...] 部分のみを解答として抽出
                                const match = w.sentence.match(/\[(.*?)\]/);
                                const answer = match ? match[1] : w.english;
                                return `
                                    <div style="padding: 10px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between;">
                                        <div>
                                            <span style="font-weight:bold; color:#475569; margin-right:15px;">(${i+1})</span>
                                            <span style="font-weight:bold; color:#0f172a; font-size:16px; font-family:monospace; background: #f8fafc; padding: 2px 6px; border-radius:4px;">${escapeHtml(answer)}</span>
                                        </div>
                                        <div style="font-size:12px; color:#64748b; text-align:right;">
                                            [原語句: ${escapeHtml(w.english)}]
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }
            },
            { 
                id: 'download-sentence-mixed-quiz-btn', 
                title: '例文和訳・空所補充記述テスト', 
                content: (ws) => {
                    const valid = ws.filter(w => w.sentence).sort(() => 0.5 - Math.random());
                    const testItems = valid.map((w, index) => {
                        const isBlankFill = Math.random() > 0.5;
                        const match = w.sentence.match(/\[(.*?)\]/);
                        const answerText = match ? match[1] : w.english;
                        
                        return {
                            index: index + 1,
                            type: isBlankFill ? 'blank' : 'translation',
                            rawWord: w.english,
                            japaneseMeaning: w.japanese,
                            fullSentence: w.sentence.replace(/[\[\]]/g, ''),
                            blankSentence: w.sentence.replace(/\[(.*?)\]/g, ' ( __________ ) '),
                            sentenceJa: w.sentence_ja,
                            answer: isBlankFill ? answerText : w.sentence_ja
                        };
                    });

                    return `
                        <p style="margin-bottom:30px; font-weight:bold;">【問題】問題の指示（空所補充 または 全文和訳）に従いなさい。</p>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 26px;">
                            ${testItems.map((item) => {
                                if (item.type === 'blank') {
                                    return `
                                        <div style="border-bottom: 1px dashed #cbd5e1; padding-bottom: 15px;">
                                            <div style="font-weight:bold; color: #0284c7; font-size: 11px; margin-bottom: 5px;">
                                                (${item.index}) 【空所補充】和訳を参考にして、括弧に入る適切な単語・熟語を書きなさい。
                                            </div>
                                            <div style="font-size:16px; font-family:serif; line-height:1.5; margin-left: 15px; color:#1e293b;">
                                                ${escapeHtml(item.blankSentence)}
                                            </div>
                                            <div style="color:#475569; font-size:13px; margin-left: 15px; margin-top:5px;">
                                                訳: ${escapeHtml(item.sentenceJa)}
                                            </div>
                                            <div style="margin-top:10px; border-bottom:1px solid #94a3b8; width:50%; height:25px; margin-left: 15px;"></div>
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div style="border-bottom: 1px dashed #cbd5e1; padding-bottom: 15px;">
                                            <div style="font-weight:bold; color: #f97316; font-size: 11px; margin-bottom: 5px;">
                                                (${item.index}) 【全文和訳】下線部（重要表現）に注意して、次の英文を日本語に直しなさい。
                                            </div>
                                            <div style="font-size:16px; font-family:serif; line-height:1.5; margin-left: 15px; color:#1e293b;">
                                                ${escapeHtml(item.fullSentence.replace(item.rawWord, '____' + item.rawWord + '____'))}
                                            </div>
                                            <div style="margin-top:10px; border-bottom:1px solid #cbd5e1; width:90%; height:30px; margin-left: 15px;"></div>
                                        </div>
                                    `;
                                }
                            }).join('')}
                        </div>
                        <div style="page-break-before:always;"></div>
                        <h1 style="text-align:center; border-bottom:2px solid #333; padding-bottom:10px; margin-bottom:30px;">例文和訳・空所補充記述テスト 【解答】</h1>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 15px; font-size:15px;">
                            ${testItems.map((item) => `
                                <div style="padding: 10px; border-bottom: 1px solid #f1f5f9;">
                                    <span style="font-weight:bold; color:#475569; margin-right:10px;">(${item.index})</span>
                                    <span style="font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; margin-right:15px; background:${item.type === 'blank' ? '#e0f2fe; color:#0369a1;' : '#ffedd5; color:#c2410c;'}">
                                        ${item.type === 'blank' ? '空所補充' : '全文和訳'}
                                    </span>
                                    <span style="font-weight:bold; color:#0f172a; font-size:15px;">${escapeHtml(item.answer)}</span>
                                    <div style="color:#64748b; font-size:12px; margin-top:5px; padding-left:20px;">
                                        【参考】${escapeHtml(item.fullSentence)} (表現: ${escapeHtml(item.rawWord)} - ${escapeHtml(item.japaneseMeaning)})
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }
        ];

        window.onload = () => {
            // PDF出力イベントバインド
            pdfActions.forEach(act => {
                const btn = document.getElementById(act.id);
                if(btn) {
                    btn.onclick = () => {
                        const checks = document.querySelectorAll('.word-checkbox:checked');
                        if (!checks.length) return alert('プリントに反映する重要語句を一覧から選択してください。');
                        const words = Array.from(checks).map(c => vocabularyData[c.dataset.index]);
                        
                        // 印刷用新ウィンドウ生成
                        const w = window.open('', '_blank');
                        w.document.write(`<html>
                            <head>
                                <title>${act.title}</title>
                                <style>
                                    body{font-family:'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; margin:40px; line-height:1.6; color:#1e293b;}
                                    .app-title{text-align:center; font-size:12px; color:#64748b; margin-bottom:5px; text-transform:uppercase; letter-spacing:1px;}
                                    h1{text-align:center; border-bottom:3px double #334155; padding-bottom:12px; margin-top:0; color:#0f172a;}
                                    h2{background:#f8fafc; border-left:4px solid #0ea5e9; padding:8px 15px; margin-top:30px; font-size:18px; color:#1e293b;}
                                    ol li{margin-bottom:15px; line-height:1.7;}
                                    .quiz-ans-sheet { margin-top: 20px; }
                                    @media print {
                                        .page-break { page-break-before: always; }
                                    }
                                </style>
                            </head>
                            <body>
                                <div class="app-title">${APP_TITLE}</div>
                                <h1>${act.title}</h1>
                                ${act.content(words)}
                            </body>
                        </html>`);
                        w.document.close();
                        setTimeout(() => w.print(), 500);
                    };
                }
            });
        };
    </script>
</body>
</html>
